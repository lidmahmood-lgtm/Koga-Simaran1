<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سیستەمی کۆگا — فرۆشگای ئامێرەکانی ئەمنیەت</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: rgba(255,255,255,0.08);
    --text: #eef0f8;
    --muted: #8b92b3;
    --accent: #4f8ef7;
    --accent2: #6ee7b7;
    --warn: #f59e42;
    --danger: #f87171;
    --good: #6ee7b7;
    --profit: #a78bfa;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Naskh Arabic', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .shop-name { font-size: 17px; font-weight: 700; color: var(--text); }
  .shop-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .header-date { font-size: 12px; color: var(--muted); background: var(--surface2); padding: 4px 10px; border-radius: 20px; }

  /* Metrics */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 14px 16px;
  }
  .metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 10px 8px;
    text-align: center;
  }
  .metric-val { font-size: 18px; font-weight: 700; line-height: 1.2; }
  .metric-label { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .c-accent { color: var(--accent); }
  .c-good { color: var(--good); }
  .c-warn { color: var(--warn); }
  .c-danger { color: var(--danger); }
  .c-profit { color: var(--profit); }

  /* Alert */
  .alert {
    margin: 0 16px 8px;
    background: rgba(245,158,66,0.12);
    border: 1px solid rgba(245,158,66,0.3);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--warn);
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  /* Summary bar */
  .summary {
    margin: 0 16px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
  }
  .summary-title { font-size: 11px; color: var(--muted); margin-bottom: 10px; letter-spacing: .3px; }
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .sum-item-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .sum-item-val { font-size: 15px; font-weight: 700; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 0 16px;
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Search */
  .search-wrap { padding: 0 16px; margin-bottom: 12px; }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { outline: none; border-color: var(--accent); }

  /* Item cards */
  .items-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color .15s;
  }
  .item-card.status-low { border-color: rgba(245,158,66,0.4); }
  .item-card.status-out { border-color: rgba(248,113,113,0.4); }
  .item-top { padding: 12px 14px 8px; }
  .item-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .item-cat { font-size: 11px; color: var(--muted); }
  .item-divider { height: 1px; background: var(--border); margin: 0; }
  .item-bottom { padding: 10px 14px; }
  .item-prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .price-box { background: var(--surface2); border-radius: var(--radius-sm); padding: 7px 8px; text-align: center; }
  .price-box-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .price-box-val { font-size: 14px; font-weight: 700; cursor: pointer; }
  .price-box-val.editable:hover { color: var(--accent); }
  .price-input-inline {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--accent);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    outline: none;
    padding: 2px 0;
  }
  .item-actions { display: flex; align-items: center; justify-content: space-between; }
  .qty-control { display: flex; align-items: center; gap: 10px; }
  .qty-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .1s;
    line-height: 1;
  }
  .qty-btn:active { transform: scale(.9); background: var(--accent); }
  .qty-btn.minus:active { background: var(--danger); }
  .qty-num { font-size: 20px; font-weight: 700; min-width: 32px; text-align: center; }
  .status-badge {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
  }
  .badge-ok { background: rgba(110,231,183,0.12); color: var(--good); }
  .badge-low { background: rgba(245,158,66,0.12); color: var(--warn); }
  .badge-out { background: rgba(248,113,113,0.12); color: var(--danger); }
  .profit-line { font-size: 12px; color: var(--profit); font-weight: 600; }

  /* Log */
  .log-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .log-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .log-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .log-sold { font-size: 13px; font-weight: 700; color: var(--good); }
  .log-profit { font-size: 12px; color: var(--profit); }
  .empty-log { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

  /* FAB — Add button */
  .fab {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(79,142,247,0.4);
    transition: all .15s;
    white-space: nowrap;
    z-index: 200;
  }
  .fab:active { transform: translateX(-50%) scale(.96); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 20px 36px;
    width: 100%;
    max-width: 520px;
    max-height: 92vh;
    overflow-y: auto;
  }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; color: var(--text); }
  .field { margin-bottom: 12px; }
  .field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field select option { background: var(--surface2); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 13px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity .15s;
  }
  .btn-primary:active { opacity: .85; }
  .btn-cancel {
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
  }

  /* Sell modal */
  .sell-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 400;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .sell-overlay.open { display: flex; }
  .sell-modal {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px 20px;
    width: 100%;
    max-width: 400px;
  }
  .sell-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .sell-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .sell-qty-ctrl { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 16px 0 20px; }
  .sell-qty-btn {
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text); font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .sell-qty-num { font-size: 32px; font-weight: 700; min-width: 48px; text-align: center; }
  .sell-profit-preview {
    background: rgba(167,139,250,0.1);
    border: 1px solid rgba(167,139,250,0.25);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    text-align: center;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--profit);
    font-weight: 600;
  }

  @media (max-width: 360px) {
    .item-prices { grid-template-columns: repeat(3,1fr); }
    .price-box-val { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="shop-name">کۆگای فرۆشگا</div>
      <div class="shop-sub">ئامێرەکانی ئەمنیەت · سلێمانی</div>
    </div>
    <div class="header-date" id="hdate"></div>
  </div>
</div>

<div class="metrics">
  <div class="metric"><div class="metric-val c-accent" id="m-total">0</div><div class="metric-label">کۆی کاڵا</div></div>
  <div class="metric"><div class="metric-val c-warn" id="m-low">0</div><div class="metric-label">کەم موجودی</div></div>
  <div class="metric"><div class="metric-val c-danger" id="m-out">0</div><div class="metric-label">نەمانی</div></div>
  <div class="metric"><div class="metric-val c-good" id="m-buyval">$0</div><div class="metric-label">نرخی کۆگا</div></div>
  <div class="metric"><div class="metric-val c-accent" id="m-sellval">$0</div><div class="metric-label">کۆی فرۆشتن</div></div>
  <div class="metric"><div class="metric-val c-profit" id="m-profit">$0</div><div class="metric-label">قازانج</div></div>
</div>

<div id="alert-area"></div>

<div class="summary">
  <div class="summary-title">کۆی گشتی ئەگەر هەموو بفرۆشرێت</div>
  <div class="summary-grid">
    <div><div class="sum-item-label">نرخی کڕین</div><div class="sum-item-val c-good" id="s-buy">$0</div></div>
    <div><div class="sum-item-label">نرخی فرۆشتن</div><div class="sum-item-val c-accent" id="s-sell">$0</div></div>
    <div><div class="sum-item-label">قازانج</div><div class="sum-item-val c-profit" id="s-profit">$0</div></div>
    <div><div class="sum-item-label">ڕێژەی قازانج</div><div class="sum-item-val c-profit" id="s-pct">0%</div></div>
  </div>
</div>

<div class="tabs" id="cat-tabs">
  <button class="tab active" data-cat="">هەموو</button>
  <button class="tab" data-cat="کامێرا">کامێرا</button>
  <button class="tab" data-cat="ئایفۆنی وێنەیی">ئایفۆنی وێنەیی</button>
  <button class="tab" data-cat="کابڵ و سیم">کابڵ و سیم</button>
  <button class="tab" data-cat="DVR/NVR">DVR/NVR</button>
  <button class="tab" data-cat="log">تۆمارەکان</button>
</div>

<div class="search-wrap" id="search-wrap">
  <input class="search-input" id="search" type="text" placeholder="گەڕان بە ناوی کاڵا..." oninput="render()">
</div>

<div class="items-list" id="items-list"></div>
<div class="log-list" id="log-list" style="display:none"></div>

<button class="fab" id="fab-btn" onclick="openAdd()">+ زیادکردنی کاڵا</button>

<!-- Edit modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-title">دەستکاریکردنی کاڵا</div>
    <div class="field"><label>ناوی کاڵا</label><input id="e-name" type="text"></div>
    <div class="field"><label>جۆر</label>
      <select id="e-cat">
        <option>کامێرا</option><option>ئایفۆنی وێنەیی</option><option>کابڵ و سیم</option><option>DVR/NVR</option><option>پێکهاتەی تر</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field"><label>ژمارە</label><input id="e-qty" type="number" min="0"></div>
      <div class="field"><label>کەمترین موجودی</label><input id="e-min" type="number" min="0"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>نرخی کڕین ($)</label><input id="e-buy" type="number" min="0"></div>
      <div class="field"><label>نرخی فرۆشتن ($)</label><input id="e-sell" type="number" min="0"></div>
    </div>
    <button class="btn-primary" onclick="saveEdit()">پاشەکەوتکردن</button>
    <button class="btn-cancel" onclick="closeEdit()">داخستن</button>
  </div>
</div>

<!-- Add modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-title">زیادکردنی کاڵای نوێ</div>
    <div class="field"><label>ناوی کاڵا</label><input id="f-name" type="text" placeholder="نموونە: کامێرا Hikvision 4MP"></div>
    <div class="field"><label>جۆر</label>
      <select id="f-cat">
        <option>کامێرا</option><option>ئایفۆنی وێنەیی</option><option>کابڵ و سیم</option><option>DVR/NVR</option><option>پێکهاتەی تر</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field"><label>ژمارە</label><input id="f-qty" type="number" min="0" value="1"></div>
      <div class="field"><label>کەمترین موجودی</label><input id="f-min" type="number" min="0" value="2"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>نرخی کڕین ($)</label><input id="f-buy" type="number" min="0" placeholder="0"></div>
      <div class="field"><label>نرخی فرۆشتن ($)</label><input id="f-sell" type="number" min="0" placeholder="0"></div>
    </div>
    <button class="btn-primary" onclick="addItem()">زیادکردن بۆ کۆگا</button>
    <button class="btn-cancel" onclick="closeAdd()">داخستن</button>
  </div>
</div>

<!-- Sell modal -->
<div class="sell-overlay" id="sell-modal">
  <div class="sell-modal">
    <div class="sell-title" id="sell-item-name"></div>
    <div class="sell-sub" id="sell-item-price"></div>
    <div class="sell-qty-ctrl">
      <button class="sell-qty-btn" onclick="changeSellQty(-1)">−</button>
      <div class="sell-qty-num" id="sell-qty-num">1</div>
      <button class="sell-qty-btn" onclick="changeSellQty(1)">+</button>
    </div>
    <div class="sell-profit-preview" id="sell-profit-preview">قازانج: $0</div>
    <button class="btn-primary" onclick="confirmSell()">فرۆشتن دووپاتکردنەوە</button>
    <button class="btn-cancel" onclick="closeSell()">داخستن</button>
  </div>
</div>

<script>
let items = [
  {id:1,name:"کامێرا Hikvision 4MP",cat:"کامێرا",qty:8,buy:85,sell:120,min:3},
  {id:2,name:"کامێرا Dahua Dome 2MP",cat:"کامێرا",qty:2,buy:65,sell:95,min:3},
  {id:3,name:"ئایفۆنی وێنەیی Commax",cat:"ئایفۆنی وێنەیی",qty:5,buy:120,sell:175,min:2},
  {id:4,name:"ئایفۆنی وێنەیی Hikvision",cat:"ئایفۆنی وێنەیی",qty:0,buy:145,sell:210,min:2},
  {id:5,name:"کابڵی کواکسیال 100m",cat:"کابڵ و سیم",qty:12,buy:18,sell:28,min:4},
  {id:6,name:"کابڵی UTP Cat6 100m",cat:"کابڵ و سیم",qty:1,buy:22,sell:35,min:4},
  {id:7,name:"DVR 8 کەناڵ Hikvision",cat:"DVR/NVR",qty:3,buy:210,sell:295,min:2},
  {id:8,name:"بژاندنەوەی 12V 5A",cat:"پێکهاتەی تر",qty:15,buy:12,sell:20,min:5},
];
let nextId = 9;
let salesLog = [];
let activeCat = '';
let sellItemId = null;
let sellQty = 1;

function st(i){ return i.qty===0?'out':i.qty<=i.min?'low':'ok'; }
function stLabel(s){ return s==='out'?'نەمانی':s==='low'?'کەم':'هەیە'; }
function stClass(s){ return 'badge-'+s; }

function updateMetrics(){
  const buyV = items.reduce((a,i)=>a+i.qty*i.buy,0);
  const sellV = items.reduce((a,i)=>a+i.qty*i.sell,0);
  const profit = sellV - buyV;
  const pct = buyV>0?Math.round(profit/buyV*100):0;
  document.getElementById('m-total').textContent = items.length;
  document.getElementById('m-low').textContent = items.filter(i=>st(i)==='low').length;
  document.getElementById('m-out').textContent = items.filter(i=>st(i)==='out').length;
  document.getElementById('m-buyval').textContent = '$'+buyV.toLocaleString();
  document.getElementById('m-sellval').textContent = '$'+sellV.toLocaleString();
  document.getElementById('m-profit').textContent = '$'+profit.toLocaleString();
  document.getElementById('s-buy').textContent = '$'+buyV.toLocaleString();
  document.getElementById('s-sell').textContent = '$'+sellV.toLocaleString();
  document.getElementById('s-profit').textContent = '$'+profit.toLocaleString();
  document.getElementById('s-pct').textContent = pct+'%';
  const alerts = items.filter(i=>st(i)!=='ok');
  document.getElementById('alert-area').innerHTML = alerts.length
    ? `<div class="alert"><span class="alert-icon">⚠️</span><span>${alerts.length} کاڵا پێویستی داواکردنی هەیە: ${alerts.map(a=>a.name).join(' · ')}</span></div>`
    : '';
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const isLog = activeCat === 'log';
  document.getElementById('items-list').style.display = isLog?'none':'flex';
  document.getElementById('log-list').style.display = isLog?'flex':'none';
  document.getElementById('search-wrap').style.display = isLog?'none':'block';
  document.getElementById('fab-btn').style.display = isLog?'none':'block';

  if(isLog){ renderLog(); updateMetrics(); return; }

  let filtered = items.filter(i=>{
    if(q && !i.name.toLowerCase().includes(q)) return false;
    if(activeCat && i.cat!==activeCat) return false;
    return true;
  });

  const list = document.getElementById('items-list');
  if(!filtered.length){
    list.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--muted);font-size:14px">هیچ کاڵایەک نەدۆزرایەوە</div>';
    updateMetrics(); return;
  }
  list.innerHTML = filtered.map(i=>{
    const s = st(i);
    const prof = i.qty*(i.sell-i.buy);
    return `<div class="item-card status-${s}" id="card-${i.id}">
      <div class="item-top">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="item-name">${i.name}</div>
            <div class="item-cat">${i.cat}</div>
          </div>
          <span class="status-badge ${stClass(s)}">${stLabel(s)}</span>
        </div>
      </div>
      <div class="item-divider"></div>
      <div class="item-bottom">
        <div class="item-prices">
          <div class="price-box">
            <div class="price-box-label">نرخی کڕین</div>
            <div class="price-box-val editable c-good" onclick="editPrice(${i.id},'buy',this)" data-id="${i.id}" data-field="buy">$${i.buy}</div>
          </div>
          <div class="price-box">
            <div class="price-box-label">نرخی فرۆشتن</div>
            <div class="price-box-val editable c-accent" onclick="editPrice(${i.id},'sell',this)" data-id="${i.id}" data-field="sell">$${i.sell}</div>
          </div>
          <div class="price-box">
            <div class="price-box-label">قازانجی کۆ</div>
            <div class="price-box-val c-profit" id="prof-${i.id}">$${prof.toLocaleString()}</div>
          </div>
        </div>
        <div class="item-actions">
          <div class="qty-control">
            <button class="qty-btn minus" onclick="changeQty(${i.id},-1)" aria-label="کەمکردن">−</button>
            <div class="qty-num" id="qty-${i.id}">${i.qty}</div>
            <button class="qty-btn" onclick="changeQty(${i.id},1)" aria-label="زیادکردن">+</button>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <button onclick="openSell(${i.id})" style="background:rgba(110,231,183,0.12);color:var(--good);border:1px solid rgba(110,231,183,0.25);border-radius:20px;padding:6px 12px;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer">فرۆشتن</button>
            <button onclick="openEdit(${i.id})" style="background:rgba(79,142,247,0.12);color:var(--accent);border:1px solid rgba(79,142,247,0.25);border-radius:20px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer" aria-label="دەستکاری">✏️</button>
            <button onclick="deleteItem(${i.id})" style="background:rgba(248,113,113,0.1);color:var(--danger);border:1px solid rgba(248,113,113,0.2);border-radius:20px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer" aria-label="سڕینەوە">🗑</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  updateMetrics();
}

function renderLog(){
  const list = document.getElementById('log-list');
  if(!salesLog.length){
    list.innerHTML = '<div class="empty-log">هیچ فرۆشتنێک تۆمار نەکراوە</div>';
    return;
  }
  list.innerHTML = [...salesLog].reverse().map(l=>`
    <div class="log-card">
      <div>
        <div class="log-name">${l.name}</div>
        <div class="log-time">${l.time}</div>
      </div>
      <div style="text-align:left">
        <div class="log-sold">−${l.qty} دانە · $${l.total}</div>
        <div class="log-profit">قازانج: $${l.profit}</div>
      </div>
    </div>
  `).join('');
}

function editPrice(id, field, el){
  const item = items.find(x=>x.id===id);
  if(!item) return;
  const inp = document.createElement('input');
  inp.type = 'number'; inp.min = '0'; inp.value = item[field];
  inp.className = 'price-input-inline';
  el.replaceWith(inp);
  inp.focus(); inp.select();
  function save(){
    const val = parseFloat(inp.value);
    if(!isNaN(val) && val>=0) item[field] = val;
    render();
  }
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape') render(); });
}

function changeQty(id, d){
  const i = items.find(x=>x.id===id);
  if(!i) return;
  i.qty = Math.max(0, i.qty+d);
  const qel = document.getElementById('qty-'+id);
  const pel = document.getElementById('prof-'+id);
  const card = document.getElementById('card-'+id);
  if(qel) qel.textContent = i.qty;
  if(pel) pel.textContent = '$'+(i.qty*(i.sell-i.buy)).toLocaleString();
  if(card){ card.className = 'item-card status-'+st(i); }
  updateMetrics();
}

function deleteItem(id){
  if(!confirm('دڵنیایت دەتەوێت بسڕیتەوە؟')) return;
  items = items.filter(i=>i.id!==id);
  render();
}

function openSell(id){
  sellItemId = id;
  sellQty = 1;
  const i = items.find(x=>x.id===id);
  document.getElementById('sell-item-name').textContent = i.name;
  document.getElementById('sell-item-price').textContent = 'نرخی فرۆشتن: $'+i.sell+' · موجودی: '+i.qty+' دانە';
  document.getElementById('sell-qty-num').textContent = sellQty;
  document.getElementById('sell-profit-preview').textContent = 'قازانج: $'+(sellQty*(i.sell-i.buy));
  document.getElementById('sell-modal').classList.add('open');
}
function changeSellQty(d){
  const i = items.find(x=>x.id===sellItemId);
  sellQty = Math.max(1, Math.min(i.qty, sellQty+d));
  document.getElementById('sell-qty-num').textContent = sellQty;
  document.getElementById('sell-profit-preview').textContent = 'قازانج: $'+(sellQty*(i.sell-i.buy)).toLocaleString();
}
function closeSell(){ document.getElementById('sell-modal').classList.remove('open'); }
function confirmSell(){
  const i = items.find(x=>x.id===sellItemId);
  if(!i || sellQty > i.qty) return;
  const profit = sellQty*(i.sell-i.buy);
  const total = sellQty*i.sell;
  i.qty -= sellQty;
  salesLog.push({
    name: i.name,
    qty: sellQty,
    total: total.toLocaleString(),
    profit: profit.toLocaleString(),
    time: new Date().toLocaleString('ar-IQ')
  });
  closeSell();
  render();
}

let editItemId = null;
function openEdit(id){
  editItemId = id;
  const i = items.find(x=>x.id===id);
  document.getElementById('e-name').value = i.name;
  document.getElementById('e-cat').value = i.cat;
  document.getElementById('e-qty').value = i.qty;
  document.getElementById('e-buy').value = i.buy;
  document.getElementById('e-sell').value = i.sell;
  document.getElementById('e-min').value = i.min;
  document.getElementById('edit-modal').classList.add('open');
}
function closeEdit(){ document.getElementById('edit-modal').classList.remove('open'); }
function saveEdit(){
  const i = items.find(x=>x.id===editItemId);
  if(!i) return;
  const name = document.getElementById('e-name').value.trim();
  if(!name) return;
  i.name = name;
  i.cat  = document.getElementById('e-cat').value;
  i.qty  = parseInt(document.getElementById('e-qty').value)||0;
  i.buy  = parseFloat(document.getElementById('e-buy').value)||0;
  i.sell = parseFloat(document.getElementById('e-sell').value)||0;
  i.min  = parseInt(document.getElementById('e-min').value)||2;
  closeEdit();
  render();
}


function closeAdd(){ document.getElementById('add-modal').classList.remove('open'); }
function addItem(){
  const name = document.getElementById('f-name').value.trim();
  if(!name) return;
  items.push({
    id: nextId++,
    name,
    cat: document.getElementById('f-cat').value,
    qty: parseInt(document.getElementById('f-qty').value)||0,
    buy: parseFloat(document.getElementById('f-buy').value)||0,
    sell: parseFloat(document.getElementById('f-sell').value)||0,
    min: parseInt(document.getElementById('f-min').value)||2
  });
  ['f-name','f-buy','f-sell'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-qty').value='1';
  document.getElementById('f-min').value='2';
  closeAdd();
  render();
}

document.getElementById('cat-tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  render();
});

document.getElementById('edit-modal').addEventListener('click', e=>{
  if(e.target===document.getElementById('edit-modal')) closeEdit();
});
document.getElementById('add-modal').addEventListener('click', e=>{
  if(e.target===document.getElementById('add-modal')) closeAdd();
});
document.getElementById('sell-modal').addEventListener('click', e=>{
  if(e.target===document.getElementById('sell-modal')) closeSell();
});

document.getElementById('hdate').textContent = new Date().toLocaleDateString('ar-IQ');
render();
</script>
</body>
</html>
